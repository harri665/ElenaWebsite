# Site is served at http://<host>:38417 by default. To use another port, set
# SITE_PORT in a .env file next to this file (e.g. SITE_PORT=8080).
# The API is only reachable through the site's nginx — no host port of its own.

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Password for /admin - set ADMIN_PASSWORD in the .env file
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATA_DIR=/app/content
    volumes:
      # Pieces, posts, about text and uploads edited in /admin survive rebuilds
      - elena-content:/app/content
    networks:
      - elena-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "${SITE_PORT:-38417}:80"
    depends_on:
      - server
    networks:
      - elena-network
    restart: unless-stopped

networks:
  elena-network:
    driver: bridge

volumes:
  elena-content:
